<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REHABO-SG | Personalized Game</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Share+Tech+Mono&display=swap');

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Share Tech Mono", monospace;
      color: #eaf8ff;
      background: #020b18;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    /* =========================
       MAIN SHELL
       ========================= */

    .game-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(0, 170, 255, 0.13),
          transparent 45%
        ),
        #020b18;
    }

    .topbar {
      display: none;
    }

    .brand {
      font-family: Orbitron, sans-serif;
      letter-spacing: 0.16em;
      color: #8fe6ff;
      font-size: 15px;
    }

    .brand span {
      color: #63efc1;
    }

    .hud {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .hud-box {
      min-width: 110px;
      padding: 8px 12px;
      border: 1px solid rgba(80, 190, 255, 0.38);
      background: rgba(5, 30, 52, 0.7);
      font-size: 12px;
      text-align: center;
    }

    .hud-box strong {
      display: block;
      color: #fff;
      font-size: 17px;
      margin-top: 3px;
    }

    /* =========================
       GAME AREA / WHOLE FRAME
       ========================= */

    .game-area {
      position: relative;
      flex: none;
      width: auto;
      height: min(76vh, 620px);
      aspect-ratio: 3 / 2;
      min-height: 0;
      padding: 0;
    }

    .game-world {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;

      border: 1px solid rgba(90, 220, 255, 0.72);
      border-radius: 16px;

      box-shadow:
        0 0 40px rgba(0, 150, 255, 0.18),
        inset 0 0 45px rgba(0, 10, 25, 0.18);

      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-color: #061522;
    }

    .game-world::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(2, 12, 24, 0.06) 0%,
          rgba(2, 12, 24, 0.02) 35%,
          rgba(2, 12, 24, 0.22) 100%
        ),
        radial-gradient(
          circle at 50% 42%,
          transparent 35%,
          rgba(1, 10, 20, 0.18) 100%
        );

      pointer-events: none;
      z-index: 1;
    }

    .game-world::after {
      content: "";
      position: absolute;
      inset: 9px;

      border: 1px solid rgba(190, 245, 255, 0.16);
      box-shadow:
        inset 0 0 0 1px rgba(0, 180, 255, 0.06);

      pointer-events: none;
      z-index: 1;
    }

    /* =========================
       LEVEL BACKGROUNDS
       ========================= */

    .level-1 {
      background-image: url("./Level1-background.png");
    }

    .level-2 {
      background-image: url("./Level2-background.png");
    }

    .level-3 {
      background-image: url("./Level3-background.png");
    }

    .level-4 {
      background-image: url("./Level4-background.png");
    }

    .level-5 {
      background-image: url("./Level5-background.png");
    }

    /* =========================
       AMBIENT LIGHTS
       ========================= */

    .ambient-lights {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      mix-blend-mode: screen;
    }

    .ambient-lights i {
      position: absolute;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: rgba(255, 242, 180, 0.98);

      box-shadow:
        0 0 7px rgba(255, 244, 180, 0.95),
        0 0 18px rgba(110, 235, 255, 0.72),
        0 0 34px rgba(110, 235, 255, 0.38);

      opacity: 0.18;

      animation: ambientBlink 3.8s ease-in-out infinite;
    }

    .ambient-lights i:nth-child(1) {
      left: 12%;
      top: 35%;
      animation-delay: 0.2s;
      transform: scale(1.15);
    }

    .ambient-lights i:nth-child(2) {
      left: 27%;
      top: 22%;
      animation-delay: 1.4s;
      transform: scale(0.75);
    }

    .ambient-lights i:nth-child(3) {
      left: 47%;
      top: 31%;
      animation-delay: 2.1s;
      transform: scale(1.35);
    }

    .ambient-lights i:nth-child(4) {
      left: 61%;
      top: 18%;
      animation-delay: 0.9s;
      transform: scale(0.85);
    }

    .ambient-lights i:nth-child(5) {
      left: 76%;
      top: 39%;
      animation-delay: 2.7s;
      transform: scale(1.05);
    }

    .ambient-lights i:nth-child(6) {
      left: 88%;
      top: 26%;
      animation-delay: 1.9s;
      transform: scale(0.7);
    }

    .ambient-lights i:nth-child(7) {
      left: 71%;
      top: 68%;
      animation-delay: 3.2s;
      transform: scale(0.8);
    }

    .ambient-lights i:nth-child(8) {
      left: 40%;
      top: 66%;
      animation-delay: 0.5s;
      transform: scale(0.65);
    }

    @keyframes ambientBlink {
      0%,
      100% {
        opacity: 0.12;
        filter: brightness(0.85);
        transform: scale(0.7);
      }

      18% {
        opacity: 0.28;
      }

      38% {
        opacity: 0.95;
        filter: brightness(1.55);
        transform: scale(1.25);
      }

      53% {
        opacity: 0.45;
      }

      70% {
        opacity: 0.78;
        transform: scale(1);
      }

      86% {
        opacity: 0.16;
      }
    }

    /* =========================
       GAME HEADER BOX
       ========================= */

    .game-header {
      position: absolute;
      left: 22px;
      top: 20px;
      z-index: 3;

      width: 185px;
      height: 126px;

      padding: 14px;

      border: 1px solid rgba(100, 220, 255, 0.52);
      border-radius: 8px;

      background: rgba(2, 15, 30, 0.76);

      backdrop-filter: blur(7px);

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.22),
        0 0 20px rgba(0, 190, 255, 0.1);

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .game-header .eyebrow {
      font-size: 8px;
      letter-spacing: 0.16em;
      color: #63efc1;
    }

    .game-header h1 {
      margin: 7px 0 6px;

      font-family: Orbitron, sans-serif;
      font-size: clamp(17px, 1.65vw, 22px);
      letter-spacing: 0.06em;
      line-height: 1.02;
    }

    .game-header p {
      margin: 0;
      color: #bcecff;
      font-size: 9px;
      line-height: 1.35;
    }

    /* =========================
       OBJECTIVE BOX
       ========================= */

    .objective {
      position: absolute;
      right: 22px;
      top: 20px;
      z-index: 3;

      width: 165px;
      height: 108px;

      padding: 13px;

      border: 1px solid rgba(100, 220, 255, 0.52);
      border-radius: 8px;

      background: rgba(2, 15, 30, 0.76);

      text-align: right;
      font-size: 9px;
      line-height: 1.4;

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.22),
        0 0 20px rgba(0, 190, 255, 0.1);

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .objective b {
      color: #8fe6ff;
      margin-bottom: 5px;
    }

    /* =========================
       MOVEMENT DIRECTION BOX
       ========================= */

    .direction-card {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 5;

      width: 185px;
      height: 80px;

      padding: 10px 12px;

      border: 1px solid #63dfff;
      border-radius: 8px;

      background: rgba(2, 15, 30, 0.86);

      box-shadow:
        0 0 25px rgba(0, 190, 255, 0.18);

      text-align: center;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .direction-card .label {
      color: #77b6ce;
      font-size: 9px;
      letter-spacing: 0.14em;
    }

    .direction-card strong {
      display: block;
      margin-top: 5px;

      color: #fff;

      font-family: Orbitron, sans-serif;
      font-size: 19px;
      letter-spacing: 0.09em;
    }

    /* =========================
       MOVEMENT TARGET
       ========================= */

    .target {
      position: absolute;
      z-index: 4;

      width: 90px;
      height: 90px;

      border: 3px solid #63efc1;
      border-radius: 50%;

      background: rgba(55, 239, 193, 0.18);

      box-shadow:
        0 0 18px #63efc1,
        0 0 55px rgba(99, 239, 193, 0.55);

      display: grid;
      place-items: center;

      font-size: 42px;
      color: #fff;

      transition:
        left 0.25s,
        top 0.25s;
    }

    .target.hidden {
      display: none;
    }

    .target.hit {
      animation: hit 0.35s ease;
    }

    .target.warn {
      border-color: #ffb86b;

      box-shadow:
        0 0 20px #ffb86b,
        0 0 55px rgba(255, 184, 107, 0.4);
    }

    @keyframes hit {
      50% {
        transform: scale(1.35);
        opacity: 0.3;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* =========================
       FEEDBACK
       ========================= */

    .feedback {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 8;

      pointer-events: none;

      padding: 18px 25px;

      border: 1px solid #63efc1;

      background: rgba(2, 20, 30, 0.9);
      color: #63efc1;

      font-family: Orbitron, sans-serif;
      font-size: 22px;
      letter-spacing: 0.1em;

      opacity: 0;
    }

    .feedback.show {
      animation: feedback 0.65s ease;
    }

    .feedback.bad {
      border-color: #ff8a8a;
      color: #ff9a9a;
    }

    @keyframes feedback {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }

      25%,
      75% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    /* =========================
       LIVES
       ========================= */

    .lives {
      position: absolute;
      left: 22px;
      bottom: 22px;
      z-index: 5;

      padding: 8px 12px;

      border: 1px solid rgba(255, 140, 140, 0.35);
      background: rgba(2, 15, 30, 0.82);

      font-size: 12px;
    }

    .lives b {
      color: #ff9a9a;
    }

    /* =========================
       SERIAL CONTROLS
       ========================= */

    .serial {
      position: absolute;
      right: 22px;
      bottom: 22px;
      z-index: 5;

      display: flex;
      gap: 7px;
      align-items: center;
    }

    .serial button,
    .exit {
      border: 1px solid rgba(110, 220, 255, 0.5);

      padding: 9px 12px;

      color: #eaf8ff;
      background: rgba(2, 18, 34, 0.88);

      font: inherit;
      cursor: pointer;
    }

    .serial button:hover,
    .exit:hover {
      background: rgba(10, 85, 120, 0.9);
    }

    .serial-status {
      padding: 8px 10px;

      border: 1px solid rgba(100, 220, 255, 0.3);

      background: rgba(2, 15, 30, 0.82);

      font-size: 10px;
      color: #8fdcff;
    }

    /* =========================
       RESULT OVERLAY
       ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;

      display: grid;
      place-items: center;

      background: rgba(0, 5, 13, 0.82);

      backdrop-filter: blur(8px);
    }

    .overlay.hidden {
      display: none;
    }

    .modal {
      width: min(560px, calc(100% - 30px));

      padding: 30px;

      border: 1px solid #63dfff;

      background:
        linear-gradient(
          145deg,
          #061b31,
          #020d1d
        );

      box-shadow:
        0 0 50px rgba(0, 170, 255, 0.2);

      text-align: center;
    }

    .modal .kicker {
      color: #63efc1;
      font-size: 11px;
      letter-spacing: 0.18em;
    }

    .modal h2 {
      font-family: Orbitron, sans-serif;
      font-size: 26px;
      margin: 12px 0;
    }

    .modal p {
      color: #b8d9e8;
      line-height: 1.6;
    }

    .modal .big {
      color: #8fe6ff;

      font-family: Orbitron, sans-serif;
      font-size: 20px;
    }

    .modal button {
      margin: 8px;
      padding: 11px 18px;

      border: 1px solid #63dfff;

      color: #fff;
      background: #07577e;

      font: inherit;
      cursor: pointer;
    }

    .modal button.secondary {
      background: transparent;
    }

    .hidden-game {
      display: none !important;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 750px) {
      body {
        overflow: auto;
      }

      .game-shell {
        padding: 10px;
      }

      .game-area {
        width: min(94vw, 620px);
        height: auto;
        aspect-ratio: 3 / 2;
        min-height: 0;
      }

      .game-world {
        min-height: 0;
        border-radius: 12px;
      }

      .game-header {
        left: 12px;
        top: 12px;

        width: 165px;
        height: 112px;
      }

      .objective {
        right: 12px;
        top: 12px;

        width: 150px;
        height: 96px;
      }

      .direction-card {
        bottom: 68px;

        width: 170px;
        height: 74px;
      }

      .serial {
        left: 12px;
        right: 12px;
        bottom: 10px;

        justify-content: flex-start;
        flex-wrap: wrap;
      }

      .target {
        width: 72px;
        height: 72px;
      }
    }
  </style>
</head>

<body>

  <div class="game-shell">

    <!-- Hidden topbar retained from original structure -->
    <header class="topbar">
      <div class="brand">
        REHABO-SG
        <span>// PERSONALIZED GAME</span>
      </div>

      <div class="hud">
        <div class="hud-box">
          LEVEL
          <strong id="levelHud">—</strong>
        </div>

        <div class="hud-box">
          BILATERAL AVG
          <strong id="averageHud">—</strong>
        </div>

        <div class="hud-box">
          SCORE
          <strong id="scoreHud">0</strong>
        </div>
      </div>
    </header>

    <main class="game-area">

      <section
        id="gameWorld"
        class="game-world level-1"
      >

        <!-- Ambient blinking lights -->
        <div
          class="ambient-lights"
          aria-hidden="true"
        >
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
        </div>

        <!-- Game title/dashboard -->
        <div class="game-header">
          <div class="eyebrow">
            PERSONALIZED REHABILITATION
          </div>

          <h1 id="gameName">
            LOADING...
          </h1>

          <p id="gameSubtitle">
            Preparing your game...
          </p>
        </div>

        <!-- Objective dashboard -->
        <div class="objective">
          <b>OBJECTIVE</b>
          <br>

          <span id="objectiveText">
            Loading...
          </span>
        </div>

        <!-- Direction target -->
        <div
          id="target"
          class="target"
        >
          ↑
        </div>

        <!-- Movement requirement -->
        <div
          id="directionCard"
          class="direction-card"
        >
          <div class="label">
            WRIST MOVEMENT REQUIRED
          </div>

          <strong id="directionText">
            READY
          </strong>
        </div>

        <!-- Lives -->
        <div class="lives">
          LIVES:
          <b id="livesText">—</b>
        </div>

        <!-- Feedback -->
        <div
          id="feedback"
          class="feedback"
        ></div>

        <!-- Serial controls -->
        <div class="serial">

          <span
            id="serialStatus"
            class="serial-status"
          >
            SENSORS NOT CONNECTED
          </span>

          <button id="connectLeft">
            CONNECT LEFT
          </button>

          <button id="connectRight">
            CONNECT RIGHT
          </button>

          <button
            id="exitGame"
            class="exit"
          >
            EXIT GAME
          </button>

        </div>

      </section>

    </main>
  </div>

  <!-- =========================
       RESULT OVERLAY
       ========================= -->

  <div
    id="resultOverlay"
    class="overlay hidden"
  >

    <section class="modal">

      <div
        class="kicker"
        id="resultKicker"
      >
        MISSION COMPLETE
      </div>

      <h2 id="resultTitle">
        GREAT WORK
      </h2>

      <p id="resultMessage">
        Your session is complete.
      </p>

      <p class="big">
        FINAL SCORE:
        <span id="resultScore">0</span>
      </p>

      <button id="playAgain">
        PLAY AGAIN
      </button>

      <button
        id="returnSystem"
        class="secondary"
      >
        RETURN TO SYSTEM
      </button>

    </section>
  </div>

  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>
    (() => {

      /* =========================
         GAME DEFINITIONS
         ========================= */

      const games = {
        1: {
          name: "GARDEN ADVENTURE",
          subtitle:
            "COLLECT 10 GARDEN SIGNALS USING COMFORTABLE WRIST MOVEMENTS",
          objective:
            "Collect 10 garden items. Move in the displayed direction to collect the next item."
        },

        2: {
          name: "TREASURE HUNT",
          subtitle:
            "FOLLOW THE DIRECTION SEQUENCE TO FIND HIDDEN TREASURE",
          objective:
            "Complete 5 directional sequences. A wrong direction resets the current sequence."
        },

        3: {
          name: "SKY PILOT",
          subtitle:
            "GUIDE THE AIRCRAFT THROUGH 15 DIRECTIONAL CHECKPOINTS",
          objective:
            "Pass 15 checkpoints. Missing a checkpoint costs a life."
        },

        4: {
          name: "SPACE ESCAPE",
          subtitle:
            "SURVIVE 60 SECONDS AND DODGE THE ASTEROIDS",
          objective:
            "Dodge incoming obstacles by moving your wrist in the opposite direction."
        },

        5: {
          name: "NINJA DODGE",
          subtitle:
            "BUILD YOUR COMBO AND REACH 100 POINTS",
          objective:
            "Dodge incoming attacks. Correct reactions build your combo; wrong reactions cost a life."
        }
      };

      /* =========================
         DIRECTIONS
         ========================= */

      const dirs = [
        "UP",
        "DOWN",
        "LEFT",
        "RIGHT"
      ];

      const arrows = {
        UP: "↑",
        DOWN: "↓",
        LEFT: "←",
        RIGHT: "→"
      };

      /* =========================
         GAME STATE
         ========================= */

      let record = null;
      let level = 1;
      let average = 0;
      let score = 0;
      let lives = 3;
      let active = false;

      let targetDirection = "UP";

      let sequence = [];
      let sequenceIndex = 0;

      let checkpoints = 0;

      let timeLeft = 60;
      let timer = null;

      let combo = 0;
      let lastDirectionAt = 0;

      /* =========================
         SERIAL STATE
         ========================= */

      let ports = {
        LEFT: null,
        RIGHT: null
      };

      const buffers = {
        LEFT: "",
        RIGHT: ""
      };

      /* =========================
         ELEMENT HELPER
         ========================= */

      const $ = id =>
        document.getElementById(id);

      const world = $("gameWorld");
      const target = $("target");

      /* =========================
         LOAD CALIBRATION RECORD
         ========================= */

      function loadRecord() {

        try {

          record = JSON.parse(
            localStorage.getItem(
              "rehabo-sg-game-session"
            ) ||
            localStorage.getItem(
              "rehabo-sg-latest-calibration"
            ) ||
            "null"
          );

        } catch (e) {

          record = null;
        }

        const left =
          Number(
            record?.calibrationBaselineAverage?.LEFT
          );

        const right =
          Number(
            record?.calibrationBaselineAverage?.RIGHT
          );

        const storedAvg =
          Number(
            record?.bilateralAverage
          );

        average =
          Number.isFinite(storedAvg)
            ? storedAvg
            : (
                Number.isFinite(left) &&
                Number.isFinite(right)
                  ? +(
                      (left + right) / 2
                    ).toFixed(1)
                  : 0
              );

        /* =========================
           LEVEL SELECTION
           ========================= */

        if (average <= 20) {
          level = 1;
        } else if (average <= 40) {
          level = 2;
        } else if (average <= 60) {
          level = 3;
        } else if (average <= 80) {
          level = 4;
        } else {
          level = 5;
        }
      }

      /* =========================
         LOAD LEVEL BACKGROUND
         ========================= */

      function loadLevelBackground() {

        const backgrounds = {

          1: "Level1-background.png",
          2: "Level2-background.png",
          3: "Level3-background.png",
          4: "Level4-background.png",
          5: "Level5-background.png"

        };

        const file =
          backgrounds[level] ||
          backgrounds[1];

        /*
          The five background files are in the ROOT
          of the GitHub Pages site, alongside game.html.
        */

        const src =
          "./" +
          file +
          "?v=20261004";

        world.style.backgroundImage =
          'url("' +
          src +
          '")';

        world.style.backgroundSize =
          "cover";

        world.style.backgroundPosition =
          "center";

        world.style.backgroundRepeat =
          "no-repeat";

        /*
          Preload image and report failures.
          This does not create a visible broken-image icon.
        */

        const img = new Image();

        img.onload = () => {

          console.log(
            "REHABO-SG background loaded:",
            src
          );

        };

        img.onerror = () => {

          console.error(
            "REHABO-SG background failed to load:",
            src
          );

        };

        img.src = src;
      }

      /* =========================
         DISPLAY GAME INFORMATION
         ========================= */

      function showGameInfo() {

        const g = games[level];

        $("levelHud").textContent =
          level;

        $("averageHud").textContent =
          average.toFixed(1) + "°";

        $("gameName").textContent =
          g.name;

        $("gameSubtitle").textContent =
          g.subtitle;

        $("objectiveText").textContent =
          g.objective;

        /*
          Apply the selected level class.
        */

        world.className =
          "game-world level-" +
          level;

        $("scoreHud").textContent =
          "0";

        $("livesText").textContent =
          level === 1 ||
          level === 2
            ? "∞"
            : "3";

        loadLevelBackground();
      }

      /* =========================
         SET DIRECTION
         ========================= */

      function setDirection(d) {

        targetDirection = d;

        $("directionText").textContent =
          arrows[d] +
          "  " +
          d;

        target.textContent =
          arrows[d];

        target.classList.remove(
          "hidden"
        );

        const pos = {

          UP: [50, 28],
          DOWN: [50, 68],
          LEFT: [23, 48],
          RIGHT: [77, 48]

        };

        target.style.left =
          pos[d][0] +
          "%";

        target.style.top =
          pos[d][1] +
          "%";
      }

      /* =========================
         RANDOM DIRECTION
         ========================= */

      function randomDir() {

        return dirs[
          Math.floor(
            Math.random() *
            dirs.length
          )
        ];
      }

      /* =========================
         FEEDBACK
         ========================= */

      function feedback(
        msg,
        bad = false
      ) {

        const f =
          $("feedback");

        f.textContent =
          msg;

        f.className =
          "feedback " +
          (bad ? "bad " : "") +
          "show";

        setTimeout(() => {

          f.className =
            "feedback";

        }, 650);
      }

      /* =========================
         SCORE
         ========================= */

      function setScore(v) {

        score =
          Math.max(
            0,
            v
          );

        $("scoreHud").textContent =
          score;
      }

      /* =========================
         LIVES
         ========================= */

      function setLives(v) {

        lives = v;

        $("livesText").textContent =
          Number.isFinite(v)
            ? v
            : "∞";
      }

      /* =========================
         END GAME
         ========================= */

      function endGame(success) {

        active = false;

        if (timer) {

          clearInterval(timer);
          timer = null;

        }

        $("resultKicker").textContent =
          success
            ? "MISSION COMPLETE"
            : "GAME OVER";

        $("resultTitle").textContent =
          success
            ? "GREAT WORK"
            : "KEEP PRACTICING";

        $("resultMessage").textContent =
          success
            ? "You completed your personalized rehabilitation game."
            : "The game ended. You can try again using the same personalized level.";

        $("resultScore").textContent =
          score;

        $("resultOverlay")
          .classList
          .remove("hidden");
      }

      /* =========================
         START GAME
         ========================= */

      function start() {

        score = 0;
        combo = 0;
        sequenceIndex = 0;
        checkpoints = 0;
        timeLeft = 60;

        setScore(0);

        setLives(
          level <= 2
            ? Infinity
            : 3
        );

        active = true;

        $("resultOverlay")
          .classList
          .add("hidden");

        /* LEVEL 1 */

        if (level === 1) {

          setDirection(
            randomDir()
          );

        }

        /* LEVEL 2 */

        if (level === 2) {

          sequence =
            Array.from(
              { length: 4 },
              randomDir
            );

          setDirection(
            sequence[0]
          );

        }

        /* LEVEL 3 */

        if (level === 3) {

          setDirection(
            randomDir()
          );

        }

        /* LEVEL 4 */

        if (level === 4) {

          setDirection(
            randomDir()
          );

        }

        /* LEVEL 5 */

        if (level === 5) {

          setDirection(
            randomDir()
          );

        }

        /* SPACE ESCAPE TIMER */

        if (level === 4) {

          timer =
            setInterval(() => {

              if (!active) {
                return;
              }

              timeLeft--;

              $("directionText")
                .textContent =
                "SURVIVE " +
                timeLeft +
                "s";

              if (timeLeft <= 0) {

                endGame(true);

              }

            }, 1000);
        }
      }

      /* =========================
         CORRECT MOVEMENT
         ========================= */

      function correct() {

        target.classList.remove(
          "hit"
        );

        void target.offsetWidth;

        target.classList.add(
          "hit"
        );

        feedback(
          "✓ MOVEMENT DETECTED"
        );

        /* LEVEL 1 */

        if (level === 1) {

          setScore(
            score + 1
          );

          if (score >= 10) {

            return endGame(true);

          }

          setDirection(
            randomDir()
          );
        }

        /* LEVEL 2 */

        else if (level === 2) {

          sequenceIndex++;

          setScore(
            sequenceIndex
          );

          if (
            sequenceIndex >=
            sequence.length
          ) {

            setScore(
              score + 10
            );

            sequenceIndex = 0;

            sequence =
              Array.from(
                { length: 4 },
                randomDir
              );

            feedback(
              "★ TREASURE FOUND"
            );
          }

          setDirection(
            sequence[
              sequenceIndex
            ]
          );
        }

        /* LEVEL 3 */

        else if (level === 3) {

          checkpoints++;

          setScore(
            checkpoints
          );

          if (
            checkpoints >= 15
          ) {

            return endGame(true);

          }

          setDirection(
            randomDir()
          );
        }

        /* LEVEL 4 */

        else if (level === 4) {

          setScore(
            score + 1
          );

          setDirection(
            randomDir()
          );
        }

        /* LEVEL 5 */

        else if (level === 5) {

          combo++;

          setScore(
            score +
            10 +
            Math.min(
              combo,
              5
            ) * 2
          );

          if (score >= 100) {

            return endGame(true);

          }

          setDirection(
            randomDir()
          );
        }
      }

      /* =========================
         WRONG MOVEMENT
         ========================= */

      function wrong() {

        /*
          Levels 1 and 2:
          wrong direction does not
          remove a life.
        */

        if (
          level === 1 ||
          level === 2
        ) {

          feedback(
            "× WRONG DIRECTION",
            true
          );

          return;
        }

        lives--;

        combo = 0;

        setLives(
          lives
        );

        feedback(
          "× WRONG DIRECTION",
          true
        );

        if (lives <= 0) {

          return endGame(false);

        }

        if (
          level === 3 ||
          level === 5
        ) {

          setDirection(
            randomDir()
          );
        }
      }

      /* =========================
         HANDLE DIRECTION
         ========================= */

      function handleDirection(d) {

        if (
          !active ||
          !dirs.includes(d)
        ) {

          return;
        }

        const now =
          Date.now();

        /*
          Prevent extremely rapid
          duplicate direction events.
        */

        if (
          now -
          lastDirectionAt <
          250
        ) {

          return;
        }

        lastDirectionAt =
          now;

        /* LEVEL 4 */

        if (level === 4) {

          if (
            d === targetDirection
          ) {

            correct();

          } else {

            wrong();

          }

          return;
        }

        /* LEVEL 2 */

        if (level === 2) {

          if (
            d === targetDirection
          ) {

            correct();

          } else {

            sequenceIndex = 0;

            feedback(
              "× SEQUENCE RESET",
              true
            );

            setDirection(
              sequence[0]
            );
          }

          return;
        }

        /* OTHER LEVELS */

        if (
          d === targetDirection
        ) {

          correct();

        } else {

          wrong();

        }
      }

      /* =========================
         SERIAL CONNECTION
         ========================= */

      async function connect(side) {

        if (
          !("serial" in navigator)
        ) {

          $("serialStatus")
            .textContent =
            "WEB SERIAL NOT SUPPORTED";

          return;
        }

        try {

          const port =
            await navigator
              .serial
              .requestPort();

          await port.open({
            baudRate: 115200
          });

          ports[side] =
            port;

          $("serialStatus")
            .textContent =
            side +
            " SENSOR CONNECTED";

          readPort(
            side,
            port
          );

        } catch (e) {

          $("serialStatus")
            .textContent =
            "CONNECTION CANCELLED / FAILED";
        }
      }

      /* =========================
         READ SERIAL PORT
         ========================= */

      async function readPort(
        side,
        port
      ) {

        const decoder =
          new TextDecoder();

        let buf = "";

        while (port.readable) {

          try {

            const reader =
              port
                .readable
                .getReader();

            while (true) {

              const {
                value,
                done
              } =
                await reader.read();

              if (done) {
                break;
              }

              buf +=
                decoder.decode(
                  value,
                  {
                    stream: true
                  }
                );

              let lines =
                buf.split(
                  /\r?\n/
                );

              buf =
                lines.pop() ||
                "";

              for (
                const line
                of lines
              ) {

                try {

                  const data =
                    JSON.parse(
                      line.trim()
                    );

                  const d =
                    String(
                      data.direction ||
                      ""
                    ).toUpperCase();

                  if (d) {

                    handleDirection(d);

                  }

                } catch (_) {
                  /* Ignore invalid JSON lines */
                }
              }
            }

            reader.releaseLock();

          } catch (e) {

            break;

          }
        }
      }

      /* =========================
         BUTTON EVENTS
         ========================= */

      $("connectLeft")
        .addEventListener(
          "click",
          () =>
            connect("LEFT")
        );

      $("connectRight")
        .addEventListener(
          "click",
          () =>
            connect("RIGHT")
        );

      /* =========================
         EXIT GAME
         ========================= */

      $("exitGame")
        .addEventListener(
          "click",
          () => {

            active = false;

            if (timer) {
              clearInterval(
                timer
              );
            }

            window.location.href =
              "system.html";
          }
        );

      /* =========================
         PLAY AGAIN
         ========================= */

      $("playAgain")
        .addEventListener(
          "click",
          start
        );

      /* =========================
         RETURN TO SYSTEM
         ========================= */

      $("returnSystem")
        .addEventListener(
          "click",
          () => {

            window.location.href =
              "system.html";

          }
        );

      /* =========================
         KEYBOARD CONTROLS
         ========================= */

      window.addEventListener(
        "keydown",
        e => {

          const map = {

            ArrowUp: "UP",
            ArrowDown: "DOWN",
            ArrowLeft: "LEFT",
            ArrowRight: "RIGHT"

          };

          if (map[e.key]) {

            e.preventDefault();

            handleDirection(
              map[e.key]
            );
          }
        }
      );

      /* =========================
         INITIALIZE GAME
         ========================= */

      loadRecord();

      showGameInfo();

      start();

    })();
  </script>

</body>
